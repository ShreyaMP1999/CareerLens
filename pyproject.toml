[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "careerlens"
version = "0.1.0"
description = "Agentic AI Job Search Copilot with FastAPI, MCP, RAG, semantic matching, and Streamlit."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Shreya Padaganur" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "tenacity>=8.5",
  "structlog>=24.4",
  "mcp>=1.13",
  "anthropic>=0.40",
  "openai>=1.50",
  "langgraph>=0.2",
  "sentence-transformers>=3.0",
  "chromadb>=0.5",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "streamlit>=1.38",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
careerlens-api = "app.api.main:run"
careerlens-mcp = "app.mcp_server.server:main"
careerlens-agent-demo = "app.agents.workflow:demo_main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app/services --cov=app/rag --cov=app/agents --cov=app/mcp_server --cov=app/providers --cov-report=term-missing"

[tool.coverage.report]
show_missing = true
omit = [
  "app/mcp_server/server.py",
  "app/providers/adzuna.py",
]
